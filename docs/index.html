<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>SpeakiRPG Gear Enhancement Simulator</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha256-SERKgtTty1vsDxll+qzd4Y2cF9swY9BCq62i9wXJ9Uo=" crossorigin="anonymous"></script>
</head>
<body>
	<header>
		<h1>SpeakiRPG Gear Enhancement Simulator</h1>

		<label for="select-lang">Language / 언어 / 言語</label>
		<select id="select-lang" name="lang">
			<option value="en">English</option>
			<option value="kr">한국어</option>
			<option value="ja" selected>日本語</option>
		</select>
	</header>

	<main>
		<section>
			<h2 data-i18n="simulation_settings"></h2>
			<form id="form-params">
				<div>
					<label for="level-from" data-i18n="level_from"></label>
					<input type="number" id="level-from" name="level-from" min="0" value="0" />
				</div>

				<div>
					<label for="level-to" data-i18n="level_to"></label>
					<input type="number" id="level-to" name="level-to" min="0" value="15" />
				</div>

				<div>
					<fieldset>
						<legend data-i18n="gear_type"></legend>

						<div>
							<input type="radio" id="gear-type-weapon" name="gear-type" value="weapon" checked />
							<label for="gear-type-weapon" data-i18n="weapon"></label>
						</div>

						<div>
							<input type="radio" id="gear-type-armor" name="gear-type" value="armor" />
							<label for="gear-type-armor" data-i18n="armor"></label>
						</div>
					</fieldset>
				</div>

				<div>
					<label for="max-gold" data-i18n="max_gold"></label>
					<input type="number" id="max-gold" name="max-gold" min="0" value="20000000" />
				</div>

				<div>
					<button type="button" id="button-calculate" data-i18n="calculate"></button>
				</div>
			</form>
		</section>

		<p id="p-status"></p>

		<section>
			<h2 data-i18n="level_reaching_probability"></h2>
			<canvas id="cdf-chart"></canvas>
		</section>

		<section>
			<h2 data-i18n="level_reaching_percentile"></h2>
			<table>
				<thead>
					<tr>
						<th data-i18n="reaching_probability"></th>
						<th data-i18n="required_gold"></th>
					</tr>
				</thead>
				<tbody id="tbody-percentiles">
				</tbody>
			</table>
		</section>

		<section>
			<h2 data-i18n="about_upgrade_probabilities_heading"></h2>
			<p data-i18n="about_upgrade_probabilities_1"></p>
			<p data-i18n="about_upgrade_probabilities_2"></p>
			<pre>
				S = Math.round(88 * Math.pow(0.91, n - 1))
				if (n == 1) {
					K = 100 - S
					D = 0
				} else {
					F = 100 - S
					K = Math.round(F * 0.55)
					D = F - K
				}
			</pre>
			<p data-i18n="about_upgrade_probabilities_3"></p>
		</section>

		<section>
			<h2 data-i18n="about_spent_gold_heading"></h2>
			<p data-i18n="about_spent_gold_1"></p>
		</section>
	</main>

	<footer>
		<a href="https://github.com/takejohn/speakirpg-gear-enhancement" data-i18n="source">ソース</a>
		|
		<a href="https://speakirpg.overture.io.kr/" data-i18n="speakirpg">スピキ育成</a>
	</footer>

	<script type="module" src="./scripts/index.js" defer></script>
</body>
</html>
